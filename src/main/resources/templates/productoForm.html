
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear producto</title>
</head>
<body>

    <h1 th:text= "${editando} ? 'Editando' : 'Crear nuevo producto'"></h1>

    <form th:object="${producto}"
          th:action="${editando} ? @{/productos/{id}/editar(id=${producto.id})} : @{/productos/formProducto}"
		method="post">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}">

        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}">

        <label>Stock:</label>
        <input type="number" th:field="*{stock}">

		<br> <label>Categoría:</label> <select th:field="*{categoria}">
			<option value="">-- Elige una --</option>
			<option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
		</select> <br> <br>
        <button type="submit">Guardar</button>

    </form>

</body>
</html>
